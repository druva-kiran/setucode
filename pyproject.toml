[project]
name = "setucode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0",
    "anthropic>=0.28",
    "openai>=1.30",
    "google-genai>=1.0",
    "python-dotenv>=1.0",
    "whatthepatch>=1.0",
    "filelock>=3.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
setucode = "dashboard.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.setuptools.packages.find]
include = ["app*", "dashboard*"]
